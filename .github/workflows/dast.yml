name: Security (DAST)

# OWASP ZAP active/API scan against the *running* mock-api, targeting
# security/openapi.yaml. Unlike security.yml (static analysis of source),
# this actually calls the endpoints — verb tampering, param fuzzing,
# missing/garbage x-user-role headers, etc. — against real RBAC/403/409
# logic in mock-api/server.js.
#
# Modeled on performance.yml's trigger shape (manual + weekly, not gating
# merges): it boots two servers and runs a heavier Docker-based scan, so it
# doesn't belong blocking every push/PR the way security.yml's static
# checks do. `fail_action: false` for the same reason — findings are
# visible in the uploaded report/job summary without failing the run,
# until the ruleset here has been tuned against this specific mock app.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC

jobs:
  zap-api-scan:
    name: ZAP API scan (mock-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Only the two backend services are needed — the API scan targets
      # mock-api's HTTP surface directly, not the static front-end.
      - name: Start rate-service + mock-api in the background
        run: |
          npm run start:rate-service &
          npm run start:api &

      - name: Wait for servers to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001 -o /dev/null && curl -sf http://localhost:4000/shipments -o /dev/null && break
            echo "waiting for rate-service (4001) + mock-api (4000)..."
            sleep 1
          done
          curl -sf http://localhost:4000/shipments -o /dev/null || (echo "mock-api never became ready" && exit 1)

      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: security/openapi.yaml
          format: openapi
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-scan-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore
